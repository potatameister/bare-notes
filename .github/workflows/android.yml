name: Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Lint
        run: gradle lintDebug --no-daemon

      - name: Show lint summary
        if: always()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            tail -80 app/build/reports/lint-results-debug.txt
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BARE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/bare-notes-release.jks"

      - name: Build signed release APK
        env:
          BARE_KEYSTORE_FILE: ${{ runner.temp }}/signing/bare-notes-release.jks
          BARE_KEYSTORE_PASSWORD: ${{ secrets.BARE_KEYSTORE_PASSWORD }}
          BARE_KEY_ALIAS: ${{ secrets.BARE_KEY_ALIAS }}
          BARE_KEY_PASSWORD: ${{ secrets.BARE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify release signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Report release APK size
        run: ls -l app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: bare-notes-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
